name: event_market_lab

data:
  raw_root: data/events/synthetic/raw
  source_timezone: America/New_York
  market_timezone: America/New_York
  max_tickers: 2
  min_sequence_length: 40
  min_required_rows: 0
  min_required_train_rows: 0
  min_required_tickers: 0
  min_required_history_days: 0

universe:
  exchange: null
  asset_type: null
  tickers: null
  max_tickers: 2
  min_sequence_length: 40

targets:
  horizon: 1
  threshold: 0.001
  volatility_window: 20
  zscore_window: 20
  volatility_label_k: 0.25
  regression_clip: 3.0
  primary_target: vol_direction_label
  threshold_target: vol_direction_label
  direction_target: label
  return_target: vol_target_clipped
  use_event_targets: true
  event_vol_multiplier: 1.25
  post_event_horizons: [1, 3, 6, 12]
  event_reversal_horizon: 6
  event_absorption_horizon: 6

features:
  momentum_lookback: 3
  volatility_window: 5
  relative_volume_window: 5
  volume_window: 10
  normalize: true
  use_cross_sectional: true
  use_realized_volatility: true
  use_factor_features: false
  use_cointegration_features: false

events:
  enabled: true
  cache_dir: data/events/cache
  output_path: data/events/events.parquet
  timezone: UTC
  manual_events_path: data/events/manual/events.csv
  manual_earnings_path: data/events/manual/earnings.csv
  manual_news_path: data/events/manual/news.csv
  manual_macro_calendar_path: data/events/manual/macro_calendar.csv
  run_event_study: true
  run_alpha_decay: true
  run_leakage_report: true

event_sources:
  news:
    enabled: true
    provider: local_csv
    use_finbert: false
  earnings:
    enabled: true
    provider: local_csv
  fred:
    enabled: false
  sec:
    enabled: false
  gdelt:
    enabled: false

event_alignment:
  pre_windows_minutes: [15, 30, 60]
  post_windows_minutes: [5, 15, 30, 60, 390]
  sentiment_decay_halflives_minutes: [30, 120]
  attach_macro_to_all_tickers: true

event_leakage:
  enforce_asof: true
  drop_events_without_asof: false
  allow_scheduled_event_time_pre_release: true
  block_actual_values_pre_release: true

dataset:
  window_size: 8
  stride: 1
  label_horizon: 1
  split_mode: global_time
  dataset_type: panel
  panel_context_size: 8
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  batch_size: 64
  num_workers: 0

model:
  model_name: panel_transformer
  hidden_dims: [128, 64]
  dropout: 0.1
  minn_enabled: true
  multitask_output: true
  probabilistic_output: true
  include_event_heads: true
  event_heads: true
  event_embedding_dim: 16
  use_event_type_embedding: true
  use_event_scope_embedding: true
  distribution: gaussian

training:
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  scheduler_name: cosine
  scheduler_step_size: 1
  scheduler_gamma: 0.5
  device: auto
  seed: 42
  checkpoint_dir: models/checkpoints/event_market_lab
  log_path: models/logs/event_market_lab/training_log.json
  metrics_path: models/logs/event_market_lab/metrics.json
  direction_loss_weight: 0.0
  threshold_loss_weight: 0.8
  regression_loss_weight: 0.2
  event_loss_weight: 0.0
  event_direction_loss_weight: 0.0
  event_opportunity_loss_weight: 0.2
  event_drift_loss_weight: 0.2
  event_reversal_loss_weight: 0.1
  event_absorption_loss_weight: 0.1
  regression_loss: huber
  regression_huber_delta: 1.0
  min_auc_sample_count: 10

backtest:
  long_threshold: 0.60
  short_threshold: 0.40
  confidence_threshold: 0.60
  confidence_threshold_sweep: [0.55, 0.60, 0.65]
  confidence_top_percent_sweep: [0.10, 0.20]
  periods_per_year: 19656
  execution_lag_bars: 1
  split_mode: global_time
  include_costs: true
  cost_bps_per_trade: 1.0
  slippage_bps: 0.5
  signal_source: classification_prob
  score_source: expected_utility
  selection_mode: global_abs
  event_mode: adaptive
  avoid_event_types: []
  only_event_types: []
  pre_event_flatten_minutes: 15
  post_event_cooldown_minutes: 15
  event_confidence_boost: 0.10
  block_liquidity_events: true
  allow_post_event_drift_trades: true
  event_adaptive_thresholds: true
